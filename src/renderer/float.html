<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <title>diri-float</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      background: transparent !important; 
      overflow: hidden; 
      user-select: none; 
      -webkit-user-select: none; 
      position: relative;
    }

    #orbContainer {
      width: 92px;
      height: 92px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      z-index: 10;
    }

    #orbCanvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
      cursor: pointer; 
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease; 
    }

  </style>
</head>
<body>
  <div id="orbContainer">
    <canvas id="orbCanvas"></canvas>
  </div>

  <script src="float.js"></script>
</body>
</html>
